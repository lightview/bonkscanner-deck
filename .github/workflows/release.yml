name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install --no-audit --no-fund
      - run: npm run package
      - run: cd out && sha256sum bonkscanner-deck.zip > bonkscanner-deck.zip.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: bonkscanner-deck
          path: out/bonkscanner-deck.zip
      - if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            out/bonkscanner-deck.zip
            out/bonkscanner-deck.zip.sha256
          generate_release_notes: true
